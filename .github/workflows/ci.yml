name: CI — Build Native C Engine & Run Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-matrix:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Compile native C engine (Linux)
        if: runner.os == 'Linux'
        run: gcc -O3 -fPIC -shared -Wall -Wextra native/smart_sim.c -o native/smart_sim.so -lm

      - name: Compile native C engine (macOS)
        if: runner.os == 'macOS'
        run: gcc -O3 -fPIC -shared -Wall -Wextra native/smart_sim.c -o native/smart_sim.dylib -lm

      - name: Compile native C engine (Windows)
        if: runner.os == 'Windows'
        run: gcc -O3 -shared -Wall -Wextra native/smart_sim.c -o native/smart_sim.dll -lm

      - name: Run full pytest suite
        run: pytest -v

      - name: Smoke-test C engine CLI benchmark
        run: netsim --engine c --topology scale-free --nodes 200 --packet-loss 0.05 --smart-fanout 4 --max-retries 2 --runs 5

  docker-build:
    name: Docker Image Build & Health Check
    runs-on: ubuntu-latest
    needs: test-matrix
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -t netsim:ci .

      - name: Verify container CLI & C backend
        run: docker run --rm netsim:ci --engine c --topology ring --nodes 16 --runs 3