[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-resilience-sim"
version = "0.2.0"
description = "Discrete-event network resilience simulator with native C acceleration and authenticated UDP gossip"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "rich>=13.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
netsim = "netsim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netsim = ["native/*.c", "native/*.dll", "native/*.so", "native/*.dylib"]